<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice">
  <!-- Isotrol · el atardecer con aerogeneradores de su propia portada (renovables), redibujado en silueta con sus tonos -->
