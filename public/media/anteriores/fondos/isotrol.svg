      <stop offset="0.7" stop-color="#a1826a"/>
      <stop offset="0.8" stop-color="#d9a877"/>
      <stop offset="1" stop-color="#2a2320"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.68" cy="0.76" r="0.42">
